# Alembic's settings. Make a new migration after changing a tables.py with:
#   uv run alembic revision --autogenerate -m "what changed"
# then read it by hand: autogenerate misses some changes, such as check constraints.
# The database comes from ACCOUNTABLE_DB, through backend/settings.py.

[alembic]
script_location = %(here)s/backend/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
