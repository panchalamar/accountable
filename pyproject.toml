[project]
name = "accountable"
version = "0.1.0"
description = "Accountable: a sales CRM that will grow into a Business OS"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "email-validator>=2.4.0",
    "fastapi>=0.163.2",
    "pydantic>=2.14.3",
    "sqlalchemy>=2.1.9",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
addopts = "-q"
filterwarnings = [
    # SQLite can't reflect expression indexes. test_migrations.py checks them itself.
    "ignore:Skipped unsupported reflection of expression-based index:sqlalchemy.exc.SAWarning",
    "ignore:autogenerate skipping metadata-specified expression-based index:UserWarning",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
    "ty>=0.0.107",
]

[tool.ruff]
line-length = 100
extend-exclude = ["course", "community_contributions"]

[tool.ruff.lint]
extend-select = ["I", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ty.src]
include = ["backend"]

[tool.coverage.run]
source = ["backend"]
omit = ["backend/tests/*", "backend/migrations/*"]

[tool.coverage.report]
fail_under = 80
show_missing = false
skip_covered = true
