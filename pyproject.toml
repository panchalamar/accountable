[project]
name = "accountable"
version = "0.1.0"
description = "Accountable: a sales CRM that will grow into a Business OS"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "email-validator>=2.4.0",
    "fastapi>=0.163.2",
    "pydantic>=2.14.3",
    "sqlalchemy>=2.1.9",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
addopts = "-q"
filterwarnings = [
    # SQLite can't reflect expression indexes. test_migrations.py checks them itself.
    "ignore:Skipped unsupported reflection of expression-based index:sqlalchemy.exc.SAWarning",
    "ignore:autogenerate skipping metadata-specified expression-based index:UserWarning",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
]
