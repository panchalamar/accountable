# On every push to any branch: scan the whole history for secrets, then run
# `npm run check` (formatting, lint, types, secrets, and every test with
# coverage). Needs no secrets of its own.
name: CI

on:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Every commit, so gitleaks scans the whole history.
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          # From the release's checksums file.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          cd "$RUNNER_TEMP"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
          mkdir -p bin
          tar -xzf "$archive" -C bin gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Before anything else, so a leaked secret fails the run straight away.
      - name: Scan for secrets
        run: gitleaks git --no-banner --redact .

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      # No version given, so it installs the latest uv (pyproject.toml pins none).
      - uses: astral-sh/setup-uv@v10.4.0

      - name: Install packages
        run: npm ci

      # The end-to-end tests run in the Google Chrome already on the runner.
      - name: Check
        run: npm run check

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
